services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartqueue
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartqueue"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://postgres:postgres@db:5432/smartqueue?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-of-32-chars-min}
      APP_TIMEZONE: Asia/Kolkata
      CORS_ORIGINS: "*"
    ports:
      - "8080:8080"

volumes:
  pgdata:
